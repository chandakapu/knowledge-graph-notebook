        <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap');
        
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.3); 
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            margin: 10% auto; 
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.4);
            width: 40%;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            font-family: 'Outfit', sans-serif;
            backdrop-filter: blur(16px);
            animation: slideUp 0.4s ease-out;
        }
        .close {
            color: #888;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close:hover,
        .close:focus {
            color: #333;
            text-decoration: none;
        }
        #modal-title { margin-top: 0; color: #2C2C2C; font-weight: 600; font-size: 24px; border-bottom: 2px solid #6C63FF; padding-bottom: 10px; display: inline-block;}
        #modal-desc { color: #555; line-height: 1.7; font-size: 16px; margin-top: 20px;}
        </style>
        
        <div id="nodeModal" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Node Name</h2>
            <p id="modal-desc">Node Description...</p>
          </div>
        </div>
        
        <script type="text/javascript">
            document.addEventListener("DOMContentLoaded", function() {
                var modal = document.getElementById("nodeModal");
                var span = document.getElementsByClassName("close")[0];
                
                span.onclick = function() {
                    modal.style.display = "none";
                }
                window.onclick = function(event) {
                    if (event.target == modal) {
                        modal.style.display = "none";
                    }
                }
                
                // Hook into the pyvis network instance once it's loaded
                setTimeout(function() {
                    if (typeof network !== 'undefined') {
                        network.on("click", function (params) {
                            if (params.nodes.length > 0) {
                                var nodeId = params.nodes[0];
                                // Use the global nodes DataSet created by Pyvis
                                var nodeData = nodes.get(nodeId);
                                
                                document.getElementById("modal-title").innerText = nodeData.label || nodeId;
                                document.getElementById("modal-desc").innerText = nodeData.description || nodeData.title || "No details available.";
                                modal.style.display = "block";
                            }
                        });
                    }
                }, 1000); // Wait 1 second for network to initialize
            });
        </script>
